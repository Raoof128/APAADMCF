version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: adm-compliance-db
    environment:
      POSTGRES_DB: adm_compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeMe123!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_AU.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adm-network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adm-compliance-backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeMe123!}@postgres:5432/adm_compliance
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production-minimum-32-chars}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      CORS_ORIGINS: http://localhost:3000,http://localhost:80
      AZURE_REGION: ${AZURE_REGION:-australiaeast}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_KEY_VAULT_URL: ${AZURE_KEY_VAULT_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adm-network
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adm-compliance-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - adm-network
    restart: unless-stopped

  # Redis (for caching and background tasks)
  redis:
    image: redis:7-alpine
    container_name: adm-compliance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - adm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # PgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: adm-compliance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - adm-network
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  pgadmin_data:
    driver: local

networks:
  adm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
