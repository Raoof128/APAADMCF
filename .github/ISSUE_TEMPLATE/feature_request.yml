name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm before submitting
      options:
        - label: I have searched existing issues and feature requests
          required: true
        - label: I have read the project roadmap (if available)
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - ADM System Registry
        - Privacy Impact Assessments
        - Fairness & Bias Assessment
        - Transparency & Notifications
        - Individual Rights Requests
        - Compliance Monitoring
        - Audit & Governance
        - Reporting
        - Infrastructure
        - User Interface
        - API Enhancement
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (Blocking usage)
        - High (Significantly improves functionality)
        - Medium (Nice to have)
        - Low (Future consideration)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Describe the problem or use case
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: Describe your proposed solution in detail
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions have you considered?
      placeholder: Describe alternative approaches

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide examples or mockups if applicable
      placeholder: |
        - Screenshots
        - Code examples
        - API request/response examples
        - UI mockups

  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance Relevance
      description: Does this feature relate to compliance?
      options:
        - label: Improves Privacy Act compliance
        - label: Enhances OAIC guideline adherence
        - label: Supports new regulatory requirements
        - label: Improves AI ethics implementation
        - label: Not compliance-related

  - type: checkboxes
    id: impact
    attributes:
      label: Expected Impact
      description: What would this feature improve?
      options:
        - label: User experience
        - label: Performance
        - label: Security
        - label: Compliance coverage
        - label: Developer experience
        - label: Operational efficiency
        - label: Cost reduction

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information about the feature
      placeholder: Add any other context or information

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to contribute to this feature?
      options:
        - label: I am willing to submit a pull request for this feature
        - label: I can help with testing
        - label: I can help with documentation
        - label: I can help with design/mockups
